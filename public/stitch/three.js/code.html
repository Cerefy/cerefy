<!doctype html>

<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width,initial-scale=1.0" name="viewport" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
    </style>
  </head>
  <body>
    <!-- STITCH_THREEJS_START:ANIMATION_66 class="fixed inset-0 w-full h-full bg-transparent" -->
    <div class="fixed inset-0 w-full h-full bg-transparent" style="display: block">
      <script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
      <div id="threejs-container-ANIMATION_66" style="width: 100%; height: 100%"></div>
      <script>
        (function () {
          const container = document.getElementById("threejs-container-ANIMATION_66");
          const devicePixelRatio = window.devicePixelRatio || 1;
          const width = container.clientWidth || window.innerWidth;
          const height = container.clientHeight || window.innerHeight;

          const scene = new THREE.Scene();
          const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
          const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });

          renderer.setSize(width, height);
          renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
          container.appendChild(renderer.domElement);

          // Create Neural Node Group
          const nodes = new THREE.Group();
          scene.add(nodes);

          const geometry = new THREE.SphereGeometry(0.05, 16, 16);
          const material = new THREE.MeshBasicMaterial({ color: 0x00e5ff });

          const count = 50;
          const points = [];

          for (let i = 0; i < count; i++) {
            const mesh = new THREE.Mesh(geometry, material);
            const pos = new THREE.Vector3(
              (Math.random() - 0.5) * 10,
              (Math.random() - 0.5) * 10,
              (Math.random() - 0.5) * 10,
            );
            mesh.position.copy(pos);
            nodes.add(mesh);
            points.push(pos);
          }

          // Lines connecting nodes
          const lineMaterial = new THREE.LineBasicMaterial({
            color: 0x00e5ff,
            transparent: true,
            opacity: 0.2,
          });
          const lineGeometry = new THREE.BufferGeometry();
          const linePositions = new Float32Array(count * 3 * 2);
          lineGeometry.setAttribute("position", new THREE.BufferAttribute(linePositions, 3));
          const line = new THREE.LineSegments(lineGeometry, lineMaterial);
          scene.add(line);

          camera.position.z = 5;

          let mouseX = 0;
          let mouseY = 0;

          window.addEventListener("mousemove", (e) => {
            mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
            mouseY = -(e.clientY / window.innerHeight - 0.5) * 2;
          });

          window.addEventListener("resize", () => {
            const w = container.clientWidth || window.innerWidth;
            const h = container.clientHeight || window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
          });

          function animate() {
            requestAnimationFrame(animate);

            nodes.rotation.y += 0.002;
            nodes.rotation.x += 0.001;

            nodes.position.x += (mouseX * 0.5 - nodes.position.x) * 0.05;
            nodes.position.y += (mouseY * 0.5 - nodes.position.y) * 0.05;

            // Dynamic lines
            const positions = line.geometry.attributes.position.array;
            let idx = 0;
            for (let i = 0; i < nodes.children.length; i++) {
              for (let j = i + 1; j < nodes.children.length; j++) {
                const d = nodes.children[i].position.distanceTo(nodes.children[j].position);
                if (d < 3) {
                  const p1 = nodes.children[i].position;
                  const p2 = nodes.children[j].position;
                  positions[idx++] = p1.x;
                  positions[idx++] = p1.y;
                  positions[idx++] = p1.z;
                  positions[idx++] = p2.x;
                  positions[idx++] = p2.y;
                  positions[idx++] = p2.z;
                }
              }
            }
            line.geometry.attributes.position.needsUpdate = true;

            renderer.render(scene, camera);
          }

          animate();
        })();
      </script>
    </div>
    <!-- STITCH_THREEJS_END:ANIMATION_66 -->
  </body>
</html>
