services:
  database:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: sopranova
      MARIADB_USER: sopranova
      MARIADB_PASSWORD: change-me
      MARIADB_ROOT_PASSWORD: local-root-password-change-me
    ports:
      - "3306:3306"
    volumes:
      - sopranova-mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  sopranova-mariadb:
