name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Lint / Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Build Docker image (optional)
        if: env.REGISTRY != ''
        run: |
          echo "REGISTRY=${{ env.REGISTRY }}"
          docker build -t ${{ env.REGISTRY }}/cerefy-enterprise-ai:latest .
