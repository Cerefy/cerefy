apiVersion: v2
name: cerefy
description: A Helm chart for Cerefy Enterprise AI Operating System
type: application
version: 1.0.0
appVersion: "1.0.0"
dependencies:
  - name: postgresql
    version: 15.5.4
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: neo4j
    version: 5.20.0
    repository: https://helm.neo4j.com/
    condition: neo4j.enabled
