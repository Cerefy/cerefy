apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cerefy.fullname" . }}-secrets
  labels:
    {{- include "cerefy.labels" . | nindent 4 }}
type: Opaque
data:
  database-url: {{ printf "postgresql://cerefy:%s@%s-postgresql:5432/cerefy_production" .Values.postgresql.auth.password .Release.Name | b64enc | quote }}
  neo4j-password: {{ .Values.neo4j.neo4j.password | b64enc | quote }}
  gemini-api-key: {{ .Values.secrets.geminiApiKey | b64enc | quote }}
  jwt-secret: {{ .Values.secrets.jwtSecret | b64enc | quote }}
  jwt-refresh-secret: {{ .Values.secrets.jwtRefreshSecret | b64enc | quote }}
