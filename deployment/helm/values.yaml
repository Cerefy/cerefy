# Default values for Cerefy Helm Chart
replicaCount: 2

image:
  repository: ghcr.io/cerefy/cerefy
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1001

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1001

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  hosts:
    - host: cerefy.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: cerefy-tls
      hosts:
        - cerefy.local

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 250m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

# Subcharts
postgresql:
  enabled: true
  auth:
    username: cerefy
    database: cerefy_production
    existingSecret: "cerefy-db-secrets"
    secretKeys:
      adminPasswordKey: "postgres-password"
      userPasswordKey: "password"
  primary:
    persistence:
      enabled: true
      size: 10Gi
    initdb:
      scripts:
        enable-pgvector.sh: |
          #!/bin/sh
          psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "CREATE EXTENSION IF NOT EXISTS vector;"

neo4j:
  enabled: true
  neo4j:
    password: "change-me-neo4j"
  persistence:
    data:
      enabled: true
      size: 10Gi

# Extra Env variables for Cerefy core app
env:
  NODE_ENV: "production"
  PORT: "3000"
  FRONTEND_URL: "https://cerefy.local"
  LOG_LEVEL: "info"

# Secrets to be loaded
secrets:
  jwtSecret: "change-me-jwt-secret-very-long"
  jwtRefreshSecret: "change-me-jwt-refresh-secret-very-long"
  geminiApiKey: "your-gemini-key"
